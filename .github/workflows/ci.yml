name: Phase 0 CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: if test -f package-lock.json; then npm ci; else npm install; fi
      - run: npm run types
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --env dev --dry-run --outdir "$RUNNER_TEMP/worker"
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: macos-26
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter 3.47.9
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin c197ca5199e9ee5661e865596c9c07294dfab51c
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/flutter" tag 3.47.9
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: if test -f pubspec.lock; then flutter pub get --enforce-lockfile; else flutter pub get; fi
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub
      - if: matrix.target == 'android'
        run: |
          chmod +x android/gradlew
          flutter build apk --debug --no-pub
      - if: matrix.target == 'ios'
        run: flutter build ios --simulator --debug --no-codesign --no-pub
