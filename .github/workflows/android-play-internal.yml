name: Android Play Internal AAB
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Google Play version code
        required: true
        default: '1'
permissions:
  contents: read
concurrency:
  group: android-play-internal
  cancel-in-progress: false
jobs:
  bundle:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: android-play-internal
    defaults:
      run:
        working-directory: mobile
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ && "$BUILD_NUMBER" -le 2100000000 ]]
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin c197ca5199e9ee5661e865596c9c07294dfab51c
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/flutter" tag 3.47.9
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and test
        run: |
          set -euo pipefail
          if [[ -f pubspec.lock ]]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          flutter test --no-pub
      - name: Build and verify signed AAB
        env:
          ANDROID_DEV_CONFIG_BASE64: ${{ secrets.ANDROID_DEV_CONFIG_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          ANDROID_UPLOAD_ALIAS: sukusuku-upload
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_DEV_CONFIG_BASE64 ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
          config="$RUNNER_TEMP/sukusuku-android-dev.json"
          export ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/sukusuku-play-upload.p12"
          trap 'rm -f "$config" "$ANDROID_UPLOAD_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_DEV_CONFIG_BASE64" | base64 --decode > "$config"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_UPLOAD_KEYSTORE"
          python3 - "$config" <<'PY'
          import json, pathlib, sys
          from urllib.parse import urlsplit

          path = pathlib.Path(sys.argv[1])
          values = json.loads(path.read_text(encoding="utf-8-sig"))
          assert values["APP_ENV"] == "dev", "Internal test uses the dev environment"
          assert values["FIREBASE_PROJECT_ID"] == "photoshare-e1336", "Unexpected Firebase project"
          assert ":android:" in values["FIREBASE_ANDROID_APP_ID"], "Android Firebase App ID required"
          key = values["FIREBASE_ANDROID_API_KEY"]
          assert key and "REPLACE" not in key, "Android Firebase API key required"
          assert values["FIREBASE_MESSAGING_SENDER_ID"].isdigit(), "Sender ID required"
          api = urlsplit(values["API_BASE_URL"])
          assert api.scheme == "https" and api.netloc == "family-share-dev.wisemap.workers.dev"
          assert api.path in ("", "/") and not (api.query or api.fragment), "Worker origin required"
          path.write_text(json.dumps(values), encoding="utf-8")
          PY
          chmod +x android/gradlew
          flutter build appbundle --release --no-pub --build-number "$BUILD_NUMBER" --dart-define-from-file="$config"
          aab="build/app/outputs/bundle/release/app-release.aab"
          jarsigner -verify "$aab" | tee "$RUNNER_TEMP/sukusuku-aab-signature.txt"
          grep -q '^jar verified\.' "$RUNNER_TEMP/sukusuku-aab-signature.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: sukusuku-play-internal-${{ inputs.build_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
