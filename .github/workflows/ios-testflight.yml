name: Phase 0 iPhone TestFlight
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store Connect build number (increase for every upload)
        required: true
        default: '1'
permissions:
  contents: read
concurrency:
  group: phase0-ios-testflight
  cancel-in-progress: false
jobs:
  testflight:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-testflight-dev
    defaults:
      run:
        working-directory: mobile
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Flutter and check toolchain
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin c197ca5199e9ee5661e865596c9c07294dfab51c
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/flutter" tag 3.47.9
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ "${sdk%%.*}" -ge 26 ]]
          gem install xcodeproj --no-document
      - name: Resolve dependencies and run Flutter tests
        run: |
          set -euo pipefail
          if [[ -f pubspec.lock ]]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          flutter test --no-pub
      - name: Prepare configuration and signing
        env:
          IOS_DEV_CONFIG_BASE64: ${{ secrets.IOS_DEV_CONFIG_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_TEAM_ID IOS_DEV_CONFIG_BASE64 BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
          printf '%s' "$IOS_DEV_CONFIG_BASE64" | base64 --decode > "$RUNNER_TEMP/family-ios-dev.json"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/family-distribution.p12"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/family.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/family.mobileprovision" > "$RUNNER_TEMP/family-profile.plist"
          PROFILE_UUID=$(python3 - <<'PY'
          import json, os, pathlib, plistlib, shutil
          from urllib.parse import urlsplit

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          config = json.loads((temp / "family-ios-dev.json").read_text(encoding="utf-8-sig"))
          assert config["APP_ENV"] == "dev", "Phase 0 must use the dev environment"
          assert config["FIREBASE_PROJECT_ID"] == "photoshare-e1336", "Unexpected Firebase project"
          assert ":ios:" in config["FIREBASE_IOS_APP_ID"], "iOS Firebase App ID required"
          assert config["FIREBASE_IOS_API_KEY"] and "REPLACE" not in config["FIREBASE_IOS_API_KEY"], "iOS API key required"
          assert config["FIREBASE_MESSAGING_SENDER_ID"].isdigit(), "Sender ID required"
          api = urlsplit(config["API_BASE_URL"])
          assert api.scheme == "https" and api.hostname == "family-share-dev.wisemap.workers.dev", "Unexpected Worker URL"
          assert api.path in ("", "/") and not (api.query or api.fragment or api.username or api.port), "Worker origin required"

          (temp / "family-ios-dev.json").write_text(json.dumps(config), encoding="utf-8")

          profile = plistlib.loads((temp / "family-profile.plist").read_bytes())
          bundle = "biz.wisemap.familyShare"
          team = os.environ["APPLE_TEAM_ID"]
          entitlements = profile["Entitlements"]
          assert team in profile["TeamIdentifier"], "Provisioning team mismatch"
          assert entitlements["application-identifier"].split(".", 1)[1] == bundle, "Provisioning Bundle ID mismatch"
          assert entitlements.get("aps-environment") == "production", "Enable Push Notifications and regenerate the profile"
          assert not entitlements.get("get-task-allow") and "ProvisionedDevices" not in profile and not profile.get("ProvisionsAllDevices"), "App Store Connect profile required"
          for relative in ("Library/Developer/Xcode/UserData/Provisioning Profiles", "Library/MobileDevice/Provisioning Profiles"):
              destination = pathlib.Path.home() / relative
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(temp / "family.mobileprovision", destination / (profile["UUID"] + ".mobileprovision"))
          export = {
              "method": "app-store-connect",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": team,
              "provisioningProfiles": {bundle: profile["Name"]},
              "manageAppVersionAndBuildNumber": False,
          }
          (temp / "family-export.plist").write_bytes(plistlib.dumps(export))
          print(profile["UUID"])
          PY
          )
          keychain="$RUNNER_TEMP/family-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/family-distribution.p12" -P "$P12_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          PROFILE_UUID="$PROFILE_UUID" ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          release = runner.build_configurations.find { |config| config.name == 'Release' }
          release.build_settings.merge!({
            'DEVELOPMENT_TEAM' => ENV.fetch('APPLE_TEAM_ID'),
            'CODE_SIGN_STYLE' => 'Manual',
            'CODE_SIGN_IDENTITY' => 'Apple Distribution',
            'PROVISIONING_PROFILE_SPECIFIER' => ENV.fetch('PROFILE_UUID'),
          })
          project.save
          RUBY
      - name: Build and verify signed IPA
        run: |
          set -euo pipefail
          flutter build ipa --release --no-pub --build-number "$BUILD_NUMBER" \
            --dart-define-from-file="$RUNNER_TEMP/family-ios-dev.json" \
            --export-options-plist="$RUNNER_TEMP/family-export.plist"
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          [[ "${#ipas[@]}" -eq 1 ]]
          unzip -q "${ipas[0]}" -d "$RUNNER_TEMP/family-verify"
          bundles=("$RUNNER_TEMP"/family-verify/Payload/*.app)
          [[ "${#bundles[@]}" -eq 1 ]]
          codesign -d --entitlements - "${bundles[0]}" > "$RUNNER_TEMP/family-entitlements.plist"
          [[ "$(plutil -extract aps-environment raw -o - "$RUNNER_TEMP/family-entitlements.plist")" == production ]]
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]+$ && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY_BASE64" ]]
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          [[ "${#ipas[@]}" -eq 1 ]]
          xcrun altool --upload-app --type ios --file "${ipas[0]}" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Build $BUILD_NUMBER uploaded. Check TestFlight after Apple processing." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing credentials
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/family-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/family-distribution.p12" "$RUNNER_TEMP/family.mobileprovision" "$RUNNER_TEMP/family-ios-dev.json"
          if [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]+$ ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
